name: Validate and release Windows distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Scan current tree
        run: pwsh -NoProfile -File scripts/scan-current-tree.ps1
      - name: Ruff
        run: uv run --project mini-harness ruff check mini-harness/src mini-harness/tests
      - name: Pytest
        run: uv run --project mini-harness pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: unit-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Scan complete history
        run: pwsh -NoProfile -File scripts/scan-history.ps1
      - name: Build distribution
        run: pwsh -NoProfile -File scripts/build.ps1
      - name: Smoke test executable
        run: |
          .\dist\fbw-harness.exe --help
          .\dist\fbw-harness.exe demo all
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fbw-harness-windows-x64
          path: |
            dist/fbw-harness.exe
            dist/fbw-harness.exe.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Windows x64 single-file CLI distribution.
            Verify `fbw-harness.exe` with `fbw-harness.exe.sha256` before running.
          files: |
            dist/fbw-harness.exe
            dist/fbw-harness.exe.sha256
