stages:
  - test

unit-test:
  stage: test
  image: python:3.13-bookworm
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends curl ca-certificates gnupg
    - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/microsoft-prod.list
    - apt-get update
    - apt-get install --yes --no-install-recommends powershell
    - python -m pip install --disable-pip-version-check uv
  script:
    - pwsh -NoProfile -File scripts/scan-current-tree.ps1
    - uv run --project mini-harness ruff check mini-harness/src mini-harness/tests
    - uv run --project mini-harness pytest -q
