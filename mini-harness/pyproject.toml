[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbw-harness"
version = "0.1.0"
description = "FBW coding agent harness"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "keyring>=25.6,<26",
    "openai>=2.44,<3",
]

[project.scripts]
fbw-harness = "fbw_harness.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.15,<7",
    "pytest-timeout>=2.4,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
